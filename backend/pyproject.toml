[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-item-bank-api"
version = "0.1.0"
description = "FastAPI backend for Smart Item Bank"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "langchain>=0.3,<2",
    "langchain-community>=0.3,<1",
    "langgraph>=0.2,<2",
    "passlib[bcrypt]>=1.7,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-docx>=1.1,<2",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.18,<1",
    "python-pptx>=1.0,<2",
    "pypdf>=5,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
