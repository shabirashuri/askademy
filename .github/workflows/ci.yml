name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Supabase connection used by the tests. Tests run in a throwaway `pytest_sandbox` schema.
      # Set the repository secret TEST_DATABASE_URL (Session pooler URI, postgresql+psycopg://...).
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Fail early when the test database secret is missing
        run: test -n "$DATABASE_URL" || (echo "::error::Set the TEST_DATABASE_URL secret" && exit 1)
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
